  </g>
  
  <!-- Family Nodes / Leaves -->
  <circle cx="256" cy="130" r="26" fill="#fef3c7" />
  <circle cx="120" cy="110" r="22" fill="#fde68a" />
  <circle cx="210" cy="120" r="22" fill="#fde68a" />
  <circle cx="300" cy="100" r="22" fill="#fde68a" />
